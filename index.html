<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebDrop — Sua loja online em segundos</title>
<meta name="description" content="Suba um arquivo HTML e tenha sua vitrine de vendas publicada imediatamente. Sem código. Sem servidor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#ffffff;
  --bg:#f9f9f7;
  --bg2:#f2f2ee;
  --surface:#ffffff;
  --border:#e4e4de;
  --border2:#d0d0c8;
  --txt:#111110;
  --txt2:#5a5a55;
  --txt3:#9a9a92;
  --txt4:#c8c8c0;
  --accent:#0047ff;
  --accent-bg:#eef2ff;
  --accent-border:#c7d4ff;
  --ton:#0098ea;
  --ton-bg:#e6f5fd;
  --ton-border:#b3dff7;
  --green:#00875a;
  --green-bg:#e6f6f0;
  --green-border:#b3e0ce;
  --red:#d32f2f;
  --red-bg:#fdecea;
  --red-border:#f5c6c6;
  --amber:#b45309;
  --amber-bg:#fef3e2;
  --amber-border:#fcd89a;
  --r:14px;--r2:10px;--r3:6px;
  --t:160ms cubic-bezier(.4,0,.2,1);
  --sh:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --sh-md:0 2px 8px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.08);
}
html,body{min-height:100%;background:var(--bg);color:var(--txt);
  font-family:'Bricolage Grotesque',sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes appear{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.page{animation:fadeUp .3s ease both;max-width:840px;margin:0 auto;padding:40px 20px 100px}
.page-wide{animation:fadeUp .3s ease both;max-width:1100px;margin:0 auto;padding:40px 20px 100px}
#app{min-height:calc(100vh - 60px)}

/* Nav */
.bar{position:sticky;top:0;z-index:200;display:flex;align-items:center;
  justify-content:space-between;height:60px;padding:0 24px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--txt);
  display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.logo-mark{width:28px;height:28px;background:var(--accent);border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700}
.bar-links{display:flex;align-items:center;gap:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 18px;border-radius:var(--r2);font-size:13px;font-weight:600;
  transition:all var(--t);white-space:nowrap;line-height:1;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,71,255,.25)}
.btn-primary:hover{background:#0040e0;box-shadow:0 4px 16px rgba(0,71,255,.35);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--txt2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--bg2);color:var(--txt)}
.btn-ton{background:var(--ton);color:#fff}
.btn-ton:hover{background:#0088d4;transform:translateY(-1px)}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:var(--r3)}
.btn-lg{padding:13px 28px;font-size:15px;border-radius:var(--r)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-icon{width:34px;height:34px;padding:0;border-radius:var(--r3)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;box-shadow:var(--sh)}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px 18px}
.card-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh)}
.card-hover{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh);transition:all .2s}
.card-hover:hover{box-shadow:var(--sh-md);border-color:var(--border2);transform:translateY(-1px)}

/* Form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.label{font-size:11px;font-weight:700;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;font-family:'DM Mono',monospace}
.input{width:100%;padding:10px 14px;background:var(--bg);border:1.5px solid var(--border2);
  border-radius:var(--r2);outline:none;transition:all var(--t);color:var(--txt);font-size:14px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,71,255,.1);background:var(--white)}
.input::placeholder{color:var(--txt4)}
.input:disabled{opacity:.5;cursor:not-allowed}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.badge-ton{background:var(--ton-bg);color:var(--ton);border:1px solid var(--ton-border)}
.badge-grey{background:var(--bg2);color:var(--txt3);border:1px solid var(--border)}

/* Alerts */
.alert{padding:12px 16px;border-radius:var(--r2);font-size:13px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.alert-blue{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--txt3);letter-spacing:.08em;
  text-transform:uppercase;padding:10px 14px;border-bottom:1.5px solid var(--border);font-family:'DM Mono',monospace}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--bg2)}
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}

/* Site cards */
.site-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px 24px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;transition:all .2s;position:relative;overflow:hidden;box-shadow:var(--sh)}
.site-card:hover{border-color:var(--border2);box-shadow:var(--sh-md)}
.site-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.site-card-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.site-card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Drop zone */
.drop-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:40px 24px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--bg)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-bg)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);z-index:500;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  width:100%;max-width:920px;max-height:92vh;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:var(--sh-md);animation:appear .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;border-bottom:1px solid var(--border)}
.modal-body{flex:1;overflow:auto;position:relative}
.modal-body iframe{width:100%;height:100%;border:none;min-height:520px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Subdomain input */
.sub-wrap{display:flex;align-items:center;border:1.5px solid var(--border2);border-radius:var(--r2);
  overflow:hidden;transition:all var(--t);background:var(--bg)}
.sub-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,71,255,.1);background:var(--white)}
.sub-input{border:none!important;box-shadow:none!important;flex:1;border-radius:0!important;background:transparent}
.sub-tld{padding:10px 14px;background:var(--bg2);color:var(--txt3);white-space:nowrap;
  font-size:12px;border-left:1px solid var(--border);font-family:'DM Mono',monospace}
.sub-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin:0 10px;transition:all .3s}
.sub-dot.idle{background:var(--txt4)}
.sub-dot.checking{background:var(--amber);animation:pulse .8s ease infinite}
.sub-dot.ok{background:var(--green)}
.sub-dot.taken{background:var(--red)}

/* Admin */
.admin-layout{display:flex;min-height:calc(100vh - 60px)}
.admin-sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 0}
.admin-main{flex:1;padding:32px;overflow:auto;background:var(--bg)}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;
  color:var(--txt2);transition:all .15s;cursor:pointer;width:100%;text-align:left;font-weight:500}
.admin-nav-item:hover{background:var(--bg2);color:var(--txt)}
.admin-nav-item.active{background:var(--accent-bg);color:var(--accent);border-right:2px solid var(--accent)}
.admin-nav-section{font-size:10px;font-weight:700;color:var(--txt4);letter-spacing:.1em;
  text-transform:uppercase;padding:16px 20px 6px;font-family:'DM Mono',monospace}

/* Toast */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:12px 18px;font-size:13px;max-width:340px;display:flex;align-items:center;
  gap:10px;box-shadow:var(--sh-md);animation:appear .2s ease;font-weight:500}
.toast-success{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.toast-error{border-color:var(--red-border);background:var(--red-bg);color:var(--red)}
.toast-amber{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}

/* Util */
.div{border:none;border-top:1px solid var(--border);margin:24px 0}
.txt2{color:var(--txt2)}.txt3{color:var(--txt3)}
h1{font-weight:800;font-size:26px;letter-spacing:-.5px}
h2{font-weight:700;font-size:18px;letter-spacing:-.3px}
h3{font-weight:600;font-size:15px}
.mono{font-family:'DM Mono',monospace;font-size:12px}
.gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mt24{margin-top:24px}.mt32{margin-top:32px}.mt48{margin-top:48px}.mt64{margin-top:64px}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
.stat-num{font-weight:800;font-size:30px;letter-spacing:-.5px}
.stat-label{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;
  font-family:'DM Mono',monospace;margin-top:2px}
.trial-bar{background:var(--border);border-radius:99px;height:8px;overflow:hidden}
.trial-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ton));border-radius:99px;transition:width .5s}
.ref-box{background:linear-gradient(135deg,var(--accent-bg),var(--ton-bg));
  border:1px solid var(--accent-border);border-radius:var(--r);padding:20px 24px}
.ref-link{display:flex;align-items:center;gap:8px;background:var(--white);
  border:1px solid var(--border2);border-radius:var(--r2);padding:10px 14px;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--txt2)}
.pay-qr{display:flex;flex-direction:column;align-items:center;gap:12px;
  background:var(--ton-bg);border:1px solid var(--ton-border);border-radius:var(--r);padding:20px}
</style>
</head>
<body>
<div id="toast-container"></div>
<nav class="bar">
  <div class="logo" onclick="APP.nav('/')">
    <div class="logo-mark">W</div>WebDrop
  </div>
  <div class="bar-links" id="nav-links"></div>
</nav>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  WEBDROP — Frontend SPA
//  Comunicação 100% via API REST (Render backend)
// ═══════════════════════════════════════════════════════════════

const API      = 'https://webdrop-server.onrender.com';  // ← altere se necessário
const DOMAIN   = '.webdrop.app';
const MAX_SITES = 3;
const TRIAL_DAYS = 7;
const REF_DAYS   = 7;

// ── Estado global ─────────────────────────────────────────────
let STATE = { user: null, sites: [] };

// ── API helper ────────────────────────────────────────────────
async function api(method, path, body, isFormData=false) {
  const opts = {
    method,
    credentials: 'include',
    headers: isFormData ? {} : { 'Content-Type': 'application/json' },
    body: body
      ? (isFormData ? body : JSON.stringify(body))
      : undefined,
  };
  const res  = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok && !data.ok) throw new Error(data.error || 'Erro desconhecido');
  return data;
}

// ── Formatters ────────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtSize(b){ if(!b)return'0 B'; if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; return(b/1048576).toFixed(2)+' MB'; }
function fmtDate(ts){ if(!ts)return'—'; return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(ts)); }

// ── Router ────────────────────────────────────────────────────
const APP = {
  nav(path) { history.pushState({}, '', path || '/'); this.render(); },
  async render() {
    const app      = document.getElementById('app');
    const url      = new URL(location.href);
    const pathname = url.pathname;
    const params   = url.searchParams;

    app.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:300px"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div></div>';

    // Carrega sessão
    try {
      const data = await api('GET', '/api/auth/me');
      STATE.user  = data.user;
      STATE.sites = data.sites;
    } catch {
      STATE.user  = null;
      STATE.sites = [];
    }

    renderNav();

    try {
      if      (pathname === '/')                     app.innerHTML = renderHome();
      else if (pathname === '/register')             app.innerHTML = renderRegister(params.get('ref')||'');
      else if (pathname === '/login')                app.innerHTML = renderLogin();
      else if (pathname === '/dashboard')            await renderDashboard(app, params);
      else if (pathname === '/affiliates')           await renderAffiliates(app);
      else if (pathname === '/settings')             await renderSettings(app, params);
      else if (pathname === '/admin')                app.innerHTML = renderAdminLogin();
      else if (pathname === '/admin/dashboard')      await renderAdminDash(app, params);
      else                                           app.innerHTML = render404();
    } catch(e) {
      app.innerHTML = `<div class="page" style="text-align:center;padding-top:60px">
        <div class="alert alert-red" style="display:inline-flex">Erro: ${escHtml(e.message)}</div></div>`;
    }
  }
};
window.addEventListener('popstate', () => APP.render());

function renderNav() {
  const el = document.getElementById('nav-links');
  if (STATE.user) {
    el.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="APP.nav('/affiliates')">🔗 Afiliados</button>
      <button class="btn btn-ghost btn-sm" onclick="APP.nav('/dashboard')">Dashboard</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>`;
  } else {
    el.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="APP.nav('/login')">Entrar</button>
      <button class="btn btn-primary btn-sm" onclick="APP.nav('/register')">Começar grátis →</button>`;
  }
}

// ═══════════════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════════════
function renderHome() {
  return `
<div style="background:var(--white);border-bottom:1px solid var(--border)">
  <div class="page" style="padding-top:80px;text-align:center;padding-bottom:80px">
    <span class="badge badge-blue" style="margin-bottom:20px">✦ ${TRIAL_DAYS} dias grátis</span>
    <h1 style="font-size:clamp(36px,6vw,64px);line-height:1.1;margin-bottom:16px;letter-spacing:-2px">
      Sua vitrine online<br><span style="color:var(--accent)">no ar em segundos.</span>
    </h1>
    <p class="txt2" style="max-width:480px;margin:0 auto 36px;font-size:16px;line-height:1.7">
      Suba um arquivo HTML e tenha seu site de vendas publicado imediatamente. Sem código extra. Sem servidor.
    </p>
    <div class="gap" style="justify-content:center;margin-bottom:16px">
      <button class="btn btn-primary btn-lg" onclick="APP.nav('/register')">Publicar meu site grátis →</button>
      ${STATE.user
        ? `<button class="btn btn-ghost btn-lg" onclick="APP.nav('/dashboard')">Ir ao dashboard</button>`
        : `<button class="btn btn-ghost btn-lg" onclick="APP.nav('/login')">Já tenho conta</button>`}
    </div>
    <p class="txt3" style="font-size:12px">Sem cartão agora · ${TRIAL_DAYS} dias grátis · Até ${MAX_SITES} sites</p>
  </div>
</div>

<div style="background:var(--surface);border-bottom:1px solid var(--border);padding:20px">
  <div style="max-width:840px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;text-align:center">
    <div><div style="font-weight:800;font-size:28px;color:var(--accent)">3</div><div class="txt3 mono" style="font-size:10px;margin-top:4px">SITES SIMULTÂNEOS</div></div>
    <div><div style="font-weight:800;font-size:28px;color:var(--green)">${TRIAL_DAYS}</div><div class="txt3 mono" style="font-size:10px;margin-top:4px">DIAS GRÁTIS</div></div>
    <div><div style="font-weight:800;font-size:28px;color:var(--ton)">1 TON</div><div class="txt3 mono" style="font-size:10px;margin-top:4px">POR MÊS</div></div>
    <div><div style="font-weight:800;font-size:28px;color:var(--amber)">&lt;5s</div><div class="txt3 mono" style="font-size:10px;margin-top:4px">PARA PUBLICAR</div></div>
  </div>
</div>

<div class="page" style="padding-top:64px">
  <div style="text-align:center;margin-bottom:48px">
    <h2 style="font-size:clamp(22px,4vw,32px)">Como funciona</h2>
  </div>
  <div class="grid-3">
    ${[['1','Crie sua conta','Cadastre-se, escolha seu subdomínio e ganhe 7 dias grátis.','accent'],
       ['2','Suba seu HTML','Arraste o arquivo da sua página. Publicado em segundos.','ton'],
       ['3','Compartilhe','Seu link fica no ar 24/7. Receba pedidos.','green']
      ].map(([n,t,d,c])=>`
    <div class="card-hover">
      <div style="width:40px;height:40px;background:var(--${c}-bg);border:1px solid var(--${c}-border);
        border-radius:var(--r2);display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:16px;color:var(--${c});margin-bottom:16px">${n}</div>
      <h3 style="margin-bottom:8px">${t}</h3>
      <p class="txt3" style="font-size:13px;line-height:1.6">${d}</p>
    </div>`).join('')}
  </div>
</div>

let _subTimer = null;
function checkSub(val) {
  val = val.toLowerCase().replace(/[^a-z0-9-]/g,'');
  document.getElementById('reg-sub').value = val;
  const dot = document.getElementById('subDot');
  const msg = document.getElementById('subMsg');
  clearTimeout(_subTimer);
  if (val.length < 3) { dot.className='sub-dot idle'; msg.textContent='Letras minúsculas, números e hífens. Mín. 3 chars.'; msg.style.color=''; return; }
  dot.className = 'sub-dot checking'; msg.textContent = 'Verificando...'; msg.style.color = '';
  _subTimer = setTimeout(async () => {
    try {
      // Verificação client-side simples; o server valida de verdade no register
      const re = /^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/;
      if (!re.test(val)) { dot.className='sub-dot taken'; msg.textContent='✗ Formato inválido.'; msg.style.color='var(--red)'; return; }
      dot.className = 'sub-dot ok';
      msg.textContent = '✓ ' + val + DOMAIN;
      msg.style.color = 'var(--green)';
    } catch { dot.className='sub-dot idle'; }
  }, 350);
}

async function doRegister(ref='') {
  const btn  = document.getElementById('regBtn');
  const name = (document.getElementById('reg-name').value || '').trim();
  const email = (document.getElementById('reg-email').value || '').trim().toLowerCase();
  const sub  = (document.getElementById('reg-sub').value || '').trim().toLowerCase();
  const pw   = document.getElementById('reg-pw').value || '';
  const pw2  = document.getElementById('reg-pw2').value || '';
  if (!name||!email||!sub||!pw) { showToast('Preencha todos os campos.','error','⚠'); return; }
  if (pw !== pw2) { showToast('As senhas não coincidem.','error','⚠'); return; }
  if (pw.length < 8) { showToast('Senha mínimo 8 caracteres.','error','⚠'); return; }
  btn.disabled = true; btn.textContent = 'Criando conta...';
  try {
    await api('POST', '/api/auth/register', { name, email, password: pw, subdomain: sub, ref: ref || undefined });
    await APP.render();
    APP.nav('/dashboard');
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Criar conta grátis →';
    showToast(e.message,'error','⚠');
  }
}

// Upload
async function handleUpload(slot, input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 10*1024*1024) { showToast('Arquivo muito grande (máx 10MB)','error','✗'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('slot', slot);
  const btn = input.closest('label');
  btn.style.opacity = '.5';
  try {
    await api('POST', '/api/sites/upload', fd, true);
    showToast('Upload concluído! Clique em Preview.','success','✓');
    await APP.render(); APP.nav('/dashboard');
  } catch(e) {
    btn.style.opacity = '1';
    showToast(e.message,'error','✗');
  }
}

// Preview
function openPreview(slot) {
  window._previewSlot = slot;
  const overlay = document.getElementById('previewModal');
  overlay.style.display = 'flex';
  const frame = document.getElementById('previewFrame');
  frame.src = `${API}/api/sites/${slot}/draft`;
  document.getElementById('previewPublishBtn').onclick = () => { doPublish(slot); closePreview(); };
}
function closePreview() {
  document.getElementById('previewModal').style.display = 'none';
  document.getElementById('previewFrame').src = 'about:blank';
  window._previewSlot = null;
}

// Payment modal
function openPayModal() { document.getElementById('payModal').style.display = 'flex'; }
function closePayModal() { document.getElementById('payModal').style.display = 'none'; }

let _pollInterval = null;
async function createPayment() {
  const btn = document.getElementById('payCreateBtn');
  btn.disabled = true; btn.textContent = 'Gerando cobrança...';
  try {
    const data = await api('POST', '/api/payments/create');
    const content = document.getElementById('payModalContent');
    content.innerHTML = `
      <div class="pay-qr">
        <div style="font-size:13px;color:var(--ton);font-weight:600;margin-bottom:4px">Envie exatamente:</div>
        <div style="font-size:32px;font-weight:800;color:var(--ton);letter-spacing:-1px">${data.pay_amount} TON</div>
        <div style="font-size:11px;color:var(--txt3);margin-top:4px">rede TON</div>
        <div class="ref-link" style="margin-top:12px;width:100%;word-break:break-all">
          <span style="flex:1;font-size:11px">${escHtml(data.pay_address||'—')}</span>
          <button class="btn btn-ton btn-xs" onclick="navigator.clipboard.writeText('${escHtml(data.pay_address||'')}').then(()=>showToast('Endereço copiado!','success','✓'))">Copiar</button>
        </div>
        ${data.invoice_url ? `<a href="${escHtml(data.invoice_url)}" target="_blank" class="btn btn-ghost btn-sm" style="margin-top:8px">Abrir página de pagamento →</a>` : ''}
      </div>
      <div class="alert alert-blue mt16">
        <span>ℹ</span>
        <span>Após enviar, aguarde a confirmação na blockchain. Pode levar 1–5 minutos. Esta tela verifica automaticamente.</span>
      </div>
      <div id="payStatus" class="txt3" style="font-size:12px;text-align:center;margin-top:12px">
        <div class="spinner" style="margin:0 auto 8px"></div>Aguardando pagamento...
      </div>`;

    // Polling de status
    if (_pollInterval) clearInterval(_pollInterval);
    _pollInterval = setInterval(async () => {
      try {
        const s = await api('GET', `/api/payments/check?payment_id=${data.payment_id}`);
        const el = document.getElementById('payStatus');
        if (s.status === 'finished' || s.status === 'confirmed') {
          clearInterval(_pollInterval);
          if (el) el.innerHTML = '<span style="color:var(--green);font-weight:600">✓ Pagamento confirmado! Atualizando...</span>';
          setTimeout(() => { closePayModal(); APP.render(); APP.nav('/dashboard'); }, 2000);
        } else if (s.status === 'failed' || s.status === 'expired') {
          clearInterval(_pollInterval);
          if (el) el.innerHTML = '<span style="color:var(--red)">✗ Pagamento ' + s.status + '. Tente novamente.</span>';
        }
      } catch {}
    }, 10000);

  } catch(e) {
    btn.disabled = false; btn.textContent = '💎 Gerar cobrança em TON →';
    showToast(e.message,'error','✗');
  }
}

async function saveProfile() {
  const name = (document.getElementById('cfg-name').value||'').trim();
  if (!name) { showToast('Nome inválido.','error','⚠'); return; }
  try { await api('PUT', '/api/auth/profile', { name }); showToast('Perfil atualizado!','success','✓'); } catch(e) { showToast(e.message,'error','✗'); }
}
async function changePassword() {
  const cur  = document.getElementById('cfg-pw-cur').value||'';
  const pw   = document.getElementById('cfg-pw-new').value||'';
  const pw2  = document.getElementById('cfg-pw-new2').value||'';
  if (!cur||!pw||!pw2) { showToast('Preencha todos.','error','⚠'); return; }
  if (pw!==pw2) { showToast('Senhas não coincidem.','error','⚠'); return; }
  if (pw.length<8) { showToast('Senha muito curta.','error','⚠'); return; }
  try { await api('PUT', '/api/auth/password', { current_password:cur, new_password:pw }); showToast('Senha alterada!','success','✓'); ['cfg-pw-cur','cfg-pw-new','cfg-pw-new2'].forEach(id=>document.getElementById(id).value=''); }
  catch(e) { showToast(e.message,'error','✗'); }
}
async function deleteAccount() {
  if (!confirm('Deletar sua conta permanentemente? Todos os sites serão apagados.')) return;
  try { await api('DELETE', '/api/auth/account'); STATE.user=null; STATE.sites=[]; APP.nav('/'); }
  catch(e) { showToast(e.message,'error','✗'); }
}

  } catch(e) { APP.nav('/admin'); return; }

  const users    = usersData.users || [];
  const payments = paymentsData.payments || [];

  let tabContent = '';
  if (tab === 'users') {
    tabContent = `
    <div class="between" style="margin-bottom:16px">
      <h2>Usuários (${stats.totalUsers})</h2>
      <input class="input" style="width:220px;padding:8px 12px" placeholder="Filtrar..." oninput="filterRows(this.value,'u-row')">
    </div>

      <table class="tbl">
        <thead><tr><th>Nome / Email</th><th>Subdomínio</th><th>Status</th><th>Refs</th><th>Criado</th><th>Ações</th></tr></thead>
        <tbody>
          ${users.map(u=>`<tr class="u-row">
            <td><div style="font-weight:600;font-size:13px">${escHtml(u.name)}</div><div class="mono txt3" style="font-size:10px">${escHtml(u.email)}</div></td>
            <td class="mono" style="font-size:12px">${escHtml(u.subdomain)}</td>
            <td>${new Date(u.access_until)>new Date()?'<span class="badge badge-green">● Ativo</span>':'<span class="badge badge-red">Expirado</span>'}</td>
            <td><span class="badge badge-blue">${u.ref_earned||0}</span></td>
            <td class="mono txt3" style="font-size:11px">${fmtDate(u.created_at)}</td>
            <td><div class="gap">
              <button class="btn btn-ghost btn-xs" onclick="adminAddDays('${u.id}',7)">+7d</button>
              <button class="btn btn-red btn-xs" onclick="adminDeleteUser('${u.id}','${escHtml(u.email)}')">🗑</button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  } else if (tab === 'payments') {
    tabContent = `
    <h2 style="margin-bottom:16px">Pagamentos (${payments.length})</h2>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Data</th><th>Usuário</th><th>Valor</th><th>Status</th><th>IPN</th></tr></thead>
        <tbody>
          ${payments.length===0?'<tr><td colspan="5" class="txt3" style="text-align:center;padding:32px">Nenhum pagamento</td></tr>':''}
          ${payments.map(p=>`<tr>
            <td class="mono txt3" style="font-size:11px">${fmtDate(p.created_at)}</td>
            <td><div style="font-size:13px">${escHtml(p.users?.name||'—')}</div><div class="mono txt3" style="font-size:10px">${escHtml(p.users?.email||'')}</div></td>
            <td>${p.amount_ton} TON</td>
            <td>${p.status==='finished'||p.status==='confirmed'?'<span class="badge badge-green">✓ Pago</span>':'<span class="badge badge-amber">'+escHtml(p.status)+'</span>'}</td>
            <td>${p.ipn_verified?'<span class="badge badge-green">✓</span>':'<span class="badge badge-grey">—</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  app.innerHTML = `
<div class="admin-layout">
  <div class="admin-sidebar">
    <div style="padding:0 20px 20px;border-bottom:1px solid var(--border)">
      <div class="logo" style="cursor:default"><div class="logo-mark">W</div>Admin</div>
    </div>
    <div class="admin-nav-section">Painel</div>
    <button class="admin-nav-item ${tab==='users'?'active':''}" onclick="APP.nav('/admin/dashboard?tab=users')">👥 Usuários <span class="badge badge-grey" style="margin-left:auto;font-size:10px">${stats.totalUsers}</span></button>
    <button class="admin-nav-item ${tab==='payments'?'active':''}" onclick="APP.nav('/admin/dashboard?tab=payments')">💳 Pagamentos</button>
    <div class="admin-nav-section" style="margin-top:16px">Conta</div>
    <button class="admin-nav-item" style="color:var(--red)" onclick="doAdminLogout()">← Sair</button>
  </div>
  <div class="admin-main">
    <div class="grid-4" style="margin-bottom:28px">
      <div class="card-stat"><div class="stat-num">${stats.totalUsers}</div><div class="stat-label">Usuários</div></div>
      <div class="card-stat"><div class="stat-num" style="color:var(--green)">${stats.activeUsers}</div><div class="stat-label">Ativos</div></div>

  renderNav();

function filterRows(val, cls) {
  val = val.toLowerCase();
  document.querySelectorAll('.'+cls).forEach(r => { r.style.display = r.textContent.toLowerCase().includes(val) ? '' : 'none'; });
}
async function adminAddDays(id, days) {
  try { await api('POST', `/api/admin/users/${id}/add-days`, { days }); showToast(`+${days} dias adicionados!`,'success','✓'); APP.nav('/admin/dashboard?tab=users'); }
  catch(e) { showToast(e.message,'error','✗'); }
}
async function adminDeleteUser(id, email) {
  if (!confirm('Deletar ' + email + '? IRREVERSÍVEL.')) return;
  try { await api('DELETE', `/api/admin/users/${id}`); showToast('Usuário deletado.','amber','⚠'); APP.nav('/admin/dashboard?tab=users'); }
  catch(e) { showToast(e.message,'error','✗'); }
}
async function doAdminLogout() {
  try { await api('POST', '/api/admin/logout'); } catch {}
  APP.nav('/admin');
}

// ── Toasts ─────────────────────────────────────────────────────
function showToast(msg, type='success', icon='✓') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type==='error'?'error':type==='amber'?'amber':'success'}`;
  t.innerHTML = `<span>${icon}</span><span>${escHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 4000);
}
